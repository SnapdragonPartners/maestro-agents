name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Pinned tool versions. Bumping these is intentional and is part of the
# "what version analyzed this code" audit trail. Keep in sync by hand with
# the Makefile and, for GOVULNCHECK_VERSION, scheduled-security.yml (GitHub
# Actions has no native cross-workflow env share).
env:
  GOLANGCI_VERSION: v1.64.8
  GOVULNCHECK_VERSION: v1.1.4

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      # actions/* are first-party GitHub-owned, pinned by major tag. Linting
      # and govulncheck are installed via `go install @<pinned version>`
      # (immutable module versions, no third-party action) and compiled with
      # this job's Go toolchain: a golangci-lint built with an older Go than
      # go.mod targets refuses to run, which is why the prebuilt action
      # binary is not used.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tool binaries
        id: cache-go-tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-golangci-${{ env.GOLANGCI_VERSION }}-vuln-${{ env.GOVULNCHECK_VERSION }}

      - name: Install Go tools
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: go.mod / go.sum are tidy
        run: go mod tidy -diff

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Vulnerability check
        run: make vuln

      - name: Test
        run: make test

      # The mcptools module (ADR 0025, item 8) requires a released root
      # with no replace directive, so this tests exactly what its consumers
      # get. (make lint, build, vuln and test above already ran it; this
      # checks its go.mod.)
      - name: mcptools module is tidy
        working-directory: mcptools
        run: |
          set -euo pipefail
          go mod tidy -diff || { echo "::error::mcptools/go.mod is out of sync; run 'make tidy' and commit"; exit 1; }

      # The same module against the root at this commit, through a temporary
      # (never committed) go.work, so a root change that breaks mcptools
      # fails this PR rather than the next mcptools release.
      - name: mcptools module against root HEAD
        run: |
          set -euo pipefail
          go work init . ./mcptools
          (cd mcptools && go vet ./... && go build ./... && go test -race ./...)
          rm -f go.work go.work.sum
